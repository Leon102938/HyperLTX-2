{
  "dead_static_scene": {
    "signals": ["no visible action", "still room only", "object sits without hand movement or light change"],
    "why_bad": "A calm short can still feel lifeless if nothing changes on screen.",
    "fix_strategy": "Add one small physical action, fabric movement, hand placement, or visible light change."
  },
  "generic_stock_broll": {
    "signals": ["generic smiling person", "vague lifestyle room", "unmotivated beauty shot"],
    "why_bad": "It makes the scene feel interchangeable and weakens the reset story.",
    "fix_strategy": "Tie the shot to the selected motif and one concrete object or action."
  },
  "fake_text_overlay": {
    "signals": ["readable or pseudo-readable marks", "title-like foreground", "caption-like strip"],
    "why_bad": "Generated fake text was the repeated quality failure in Morning Reset runs.",
    "fix_strategy": "Use blank walls, plain fabric, unlabeled surfaces, and no graphic design elements."
  },
  "phone_next_to_object": {
    "signals": ["black rectangle beside glass", "device on table", "phone-shaped object near hand"],
    "why_bad": "A device contradicts the clean reset promise and has already caused review failures.",
    "fix_strategy": "Keep the table empty except for the single planned glass and hand action."
  },
  "split_screen_layout": {
    "signals": ["stacked frames", "collage", "multi-panel layout", "repeated frame grid"],
    "why_bad": "Panel layouts look like UI or subtitles and break the single physical scene.",
    "fix_strategy": "Force a single full-frame continuous lifestyle shot."
  },
  "dark_unclear_subject": {
    "signals": ["low visibility", "unclear person or object", "muddy dark frame"],
    "why_bad": "The reviewer cannot verify the intended clean action.",
    "fix_strategy": "Use soft natural morning light and a clear subject silhouette."
  },
  "too_many_objects": {
    "signals": ["busy table", "extra props", "decor clutter", "multiple objects competing"],
    "why_bad": "Extra props increase device, paper, label, and fake-text risk.",
    "fix_strategy": "Reduce to the selected motif props and keep surfaces uncluttered."
  },
  "debug_prompt_visible": {
    "signals": ["WORLD / SETTING", "SUBJECT / ACTION", "FORBIDDEN VISUALS", "prompt section text"],
    "why_bad": "Debug labels can be rendered as visible image text.",
    "fix_strategy": "Send only clean model prompts to image/video backends and keep debug prompts in logs."
  },
  "narration_text_visible": {
    "signals": ["Vorhang auf", "Stell ein Glas Wasser ab", "Atme ruhig am Fenster", "script sentence appears visually"],
    "why_bad": "Narration belongs to voice and timing, not to visual model prompts.",
    "fix_strategy": "Translate script intent into English physical action before compiling model prompts."
  }
}
